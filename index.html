<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Momentum & Equity Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #334155;
    }
    h1 { margin: 0; font-size: 1.3rem; font-weight: 600; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, button {
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-refresh {
      background: #2563eb;
      border-color: #3b82f6;
      font-weight: 500;
    }
    .btn-refresh:hover { background: #1d4ed8; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
    }
    th {
      background: #334155;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tr:not(:last-child) { border-bottom: 1px solid #334155; }
    tr:hover { background: #243248; }
    .badge {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
    }
    .badge-ticker { background: #059669; color: #fff; }
    .badge-private { background: #475569; color: #94a3b8; }
    .rank-col { width: 45px; font-weight: 700; color: #38bdf8; text-align: center; }
    .app-icon { width: 32px; height: 32px; border-radius: 7px; vertical-align: middle; margin-right: 8px; }
    .platform-pill {
      font-size: 0.68rem;
      padding: 2px 5px;
      border-radius: 3px;
      font-weight: 600;
      margin-left: 6px;
      vertical-align: middle;
    }
    .pill-ios { background: #1e40af; color: #93c5fd; }
    .pill-android { background: #166534; color: #86efac; }
    .tag {
      background: #334155;
      color: #94a3b8;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      margin-right: 4px;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      th:nth-child(3), td:nth-child(3) { display: none; }
      th, td { padding: 8px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>App Store Momentum Tracker</h1>
      <small style="color: #94a3b8;">Cross-platform charts linked to Google Finance</small>
    </div>
    <div class="controls">
      <select id="platformSelect">
        <option value="both" selected>Both (iOS & Android)</option>
        <option value="ios">Apple iOS</option>
        <option value="android">Google Play</option>
      </select>
      <select id="countrySelect">
        <option value="us">United States</option>
        <option value="gb">United Kingdom</option>
        <option value="world">World (Aggregated)</option>
      </select>
      <select id="limitSelect">
        <option value="25">Top 25</option>
        <option value="50" selected>Top 50</option>
      </select>
      <button class="btn-refresh" id="refreshBtn" onclick="fetchCharts()">↻ Refresh</button>
    </div>
  </div>

  <table id="chartTable">
    <thead>
      <tr>
        <th class="rank-col">#</th>
        <th>App Name</th>
        <th>Publisher</th>
        <th>Ticker</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="5" style="text-align: center; color: #94a3b8;">Loading charts...</td></tr>
    </tbody>
  </table>

  <script>
    const TICKER_MAP = {
      "Meta Platforms": "META:NASDAQ",
      "Instagram": "META:NASDAQ",
      "WhatsApp": "META:NASDAQ",
      "Google": "GOOGL:NASDAQ",
      "YouTube": "GOOGL:NASDAQ",
      "Microsoft": "MSFT:NASDAQ",
      "Snap": "SNAP:NYSE",
      "Pinterest": "PINS:NYSE",
      "Amazon": "AMZN:NASDAQ",
      "Spotify": "SPOT:NYSE",
      "Duolingo": "DUOL:NASDAQ",
      "Robinhood": "HOOD:NASDAQ",
      "OpenAI": "PRIVATE",
      "ByteDance": "PRIVATE",
      "TikTok": "PRIVATE"
    };

    function mapDeveloperToTicker(devName) {
      for (const [key, ticker] of Object.entries(TICKER_MAP)) {
        if (devName.toLowerCase().includes(key.toLowerCase())) return ticker;
      }
      return null;
    }

    // 1. Apple Feed Fetcher
    async function fetchAppleFeed(country, limit) {
      const url = `https://itunes.apple.com/${country}/rss/topfreeapplications/limit=${limit}/json`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`iOS HTTP ${res.status}`);
      const data = await res.json();
      return (data.feed.entry || []).map(entry => ({
        id: entry.id?.attributes?.["im:id"] || entry["im:name"]?.label,
        name: entry["im:name"]?.label || "Unknown",
        dev: entry["im:artist"]?.label || "Unknown",
        icon: entry["im:image"]?.[entry["im:image"]?.length - 1]?.label || "",
        platform: "iOS"
      }));
    }

    // 2. Android Google Play Feed Fetcher (Parses open RSS/XML to bypass CORS)
    async function fetchAndroidFeed(country, limit) {
      // Direct open CORS RSS reader for Google Play charts
      const feedUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(
        `https://play.google.com/store/apps/collection/cluster?clp=ogECCAc%3D:S:ANO1ljI_${country}&gl=${country}`
      )}`;
      
      try {
        const res = await fetch(feedUrl);
        if (!res.ok) throw new Error(`Android HTTP ${res.status}`);
        const data = await res.json();
        if (!data.items) return [];

        return data.items.slice(0, limit).map((item, idx) => ({
          id: item.guid || item.title,
          name: item.title?.replace(/ - Apps on Google Play/i, "") || "Unknown",
          dev: item.author || "Android Publisher",
          icon: item.thumbnail || "https://upload.wikimedia.org/wikipedia/commons/d/d7/Android_robot.svg",
          platform: "Android"
        }));
      } catch (err) {
        // Fallback: If RSS2JSON rate limits, continue smoothly with iOS results
        console.warn("Google Play RSS bridge unreachable, continuing with iOS:", err);
        return [];
      }
    }

    async function fetchCharts() {
      const btn = document.getElementById('refreshBtn');
      const tbody = document.getElementById('tableBody');
      const platform = document.getElementById('platformSelect').value;
      const selection = document.getElementById('countrySelect').value;
      const limit = parseInt(document.getElementById('limitSelect').value, 10);

      btn.disabled = true;
      btn.innerText = "Fetching...";
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Querying live stores...</td></tr>`;

      try {
        let entries = [];
        const countries = selection === "world" ? ["us", "gb", "de", "ca"] : [selection];

        for (const c of countries) {
          const tasks = [];
          if (platform === "ios" || platform === "both") {
            tasks.push(fetchAppleFeed(c, limit));
          }
          if (platform === "android" || platform === "both") {
            tasks.push(fetchAndroidFeed(c, limit));
          }

          const results = await Promise.allSettled(tasks);
          results.forEach(res => {
            if (res.status === "fulfilled") {
              entries.push(...res.value);
            }
          });
        }

        // Deduplicate or interleave results
        const seen = new Set();
        const displayList = [];
        
        entries.forEach(app => {
          const key = app.name.toLowerCase().trim();
          if (!seen.has(key)) {
            seen.add(key);
            displayList.push(app);
          }
        });

        const finalApps = displayList.slice(0, limit);

        if (finalApps.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#f87171;">No apps found. Try toggling platform or region.</td></tr>`;
          return;
        }

        let rows = "";
        finalApps.forEach((app, index) => {
          const rank = index + 1;
          const ticker = mapDeveloperToTicker(app.dev) || mapDeveloperToTicker(app.name);

          let tickerBadge = `<span style="color:#64748b; font-size:0.75rem;">—</span>`;
          let actionLink = `—`;

          if (ticker === "PRIVATE") {
            tickerBadge = `<span class="badge badge-private">Private</span>`;
          } else if (ticker) {
            const displaySymbol = ticker.split(":")[0];
            tickerBadge = `<span class="badge badge-ticker">${displaySymbol}</span>`;
            actionLink = `<a href="https://www.google.com/finance/quote/${ticker}" target="_blank" style="color: #38bdf8; text-decoration: none; font-size: 0.8rem;">Quote ↗</a>`;
          }

          const pillClass = app.platform === "iOS" ? "pill-ios" : "pill-android";

          rows += `
            <tr>
              <td class="rank-col">${rank}</td>
              <td>
                <img src="${app.icon}" class="app-icon" alt=""/>
                <strong>${app.name}</strong>
                <span class="platform-pill ${pillClass}">${app.platform}</span>
              </td>
              <td style="color:#cbd5e1;">${app.dev}</td>
              <td>${tickerBadge}</td>
              <td>${actionLink}</td>
            </tr>
          `;
        });

        tbody.innerHTML = rows;
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" style="color:#f87171; text-align:center;">Failed to pull charts: ${err.message}</td></tr>`;
      } finally {
        btn.disabled = false;
        btn.innerText = "↻ Refresh";
      }
    }

    window.onload = fetchCharts;
  </script>
</body>
</html>
